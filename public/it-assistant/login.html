<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Entrar · Assistente de Infraestrutura de TI</title>
<link rel="stylesheet" href="/styles.css"/>
<script src="/config.js"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body class="login-body">
  <div class="login-card">
    <div class="logo">🛰️</div>
    <h1>Assistente de Infraestrutura de TI</h1>
    <p class="sub">baita · monitoramento da rede doméstica para home office e videoconferência</p>
    <div id="g_id_signin"></div>
    <p class="hint">Acesso restrito a contas <strong>@<span id="domain">baita.ac</span></strong></p>
    <p id="error" class="error"></p>
  </div>
  <script>
    document.getElementById("domain").textContent = (window.IT_ASSISTANT_CONFIG && window.IT_ASSISTANT_CONFIG.allowedDomain) || "baita.ac";
    const params = new URLSearchParams(location.search);
    const err = params.get("error");
    if (err) document.getElementById("error").textContent = err;

    window.onload = function () {
      if (!window.google || !window.IT_ASSISTANT_CONFIG || !window.IT_ASSISTANT_CONFIG.googleClientId) {
        document.getElementById("error").textContent = "Login com Google indisponível (GOOGLE_CLIENT_ID não configurado no servidor).";
        return;
      }
      google.accounts.id.initialize({
        client_id: window.IT_ASSISTANT_CONFIG.googleClientId,
        login_uri: "/auth/google",
        hd: window.IT_ASSISTANT_CONFIG.allowedDomain,
        ux_mode: "redirect",
      });
      google.accounts.id.renderButton(document.getElementById("g_id_signin"), {
        theme: "filled_black", size: "large", text: "signin_with", shape: "pill", width: 280,
      });
    };
  </script>
</body>
</html>
