<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>rstoi · Infraestrutura</title>
<style>
:root{
  --bg:#0d1117;--surface:#161b22;--surface2:#21262d;--border:#30363d;
  --text:#e6edf3;--muted:#8b949e;
  --green:#3fb950;--green-dim:#0e2a18;
  --red:#f85149;--red-dim:#3d1a19;
  --yellow:#d29922;--yellow-dim:#2e2100;
  --blue:#58a6ff;--blue-dim:#051d4d;
  --purple:#bc8cff;--purple-dim:#1e0e3d;
  --accent:#1f6feb;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--text);font-family:'SF Mono','Consolas','Liberation Mono',monospace;font-size:13px;line-height:1.5}

.layout{display:grid;grid-template-rows:auto 1fr auto;height:100vh}

/* header */
header{display:flex;align-items:center;gap:12px;padding:9px 18px;background:var(--surface);border-bottom:1px solid var(--border)}
.logo{width:32px;height:32px;background:linear-gradient(135deg,#1f6feb,#bc8cff);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
header h1{font-size:14px;font-weight:600}
.sub{font-size:11px;color:var(--muted);margin-top:1px}
.hright{margin-left:auto;display:flex;align-items:center;gap:10px}
.live-dot{width:7px;height:7px;border-radius:50%;background:var(--green);animation:blink 2s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
.countdown{font-size:11px;color:var(--muted);min-width:22px}
.hbtn{background:var(--surface2);border:1px solid var(--border);color:var(--text);padding:3px 10px;border-radius:5px;cursor:pointer;font:inherit;font-size:11px}
.hbtn:hover{background:var(--border)}

/* body split */
.body{display:grid;grid-template-columns:1fr 420px;overflow:hidden;height:100%}
.left{overflow-y:auto;padding:14px;background:var(--bg)}
.right{border-left:1px solid var(--border);display:flex;flex-direction:column;background:var(--surface);overflow:hidden}

/* cards */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:8px;overflow:hidden}
.card.wide{grid-column:1/-1}
.ch{display:flex;align-items:center;gap:7px;padding:8px 13px;background:var(--surface2);border-bottom:1px solid var(--border);font-size:10px;font-weight:600;letter-spacing:.7px;text-transform:uppercase;color:var(--muted)}
.cb{padding:10px 13px}
.row{display:flex;justify-content:space-between;align-items:center;padding:3.5px 0;border-bottom:1px solid var(--border)}
.row:last-child{border-bottom:none}
.rl{color:var(--muted);font-size:12px}
.rv{font-weight:500;text-align:right;font-size:12px;max-width:63%;word-break:break-all}

/* badges */
.badge{display:inline-flex;align-items:center;gap:4px;padding:1px 7px;border-radius:20px;font-size:10px;font-weight:600}
.badge::before{content:'';width:5px;height:5px;border-radius:50%}
.ok{background:var(--green-dim);color:var(--green)}.ok::before{background:var(--green)}
.err{background:var(--red-dim);color:var(--red)}.err::before{background:var(--red)}
.warn{background:var(--yellow-dim);color:var(--yellow)}.warn::before{background:var(--yellow)}
.info{background:var(--blue-dim);color:var(--blue)}.info::before{background:var(--blue)}
.purple{background:var(--purple-dim);color:var(--purple)}.purple::before{background:var(--purple)}

/* bars */
.brow{display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid var(--border)}
.brow:last-child{border-bottom:none}
.bname{color:var(--muted);width:65px;font-size:11px;flex-shrink:0}
.bwrap{flex:1;background:var(--surface2);border-radius:3px;height:5px;overflow:hidden}
.bar{height:100%;border-radius:3px;transition:width .6s ease}
.bg{background:var(--green)}.by{background:var(--yellow)}.br{background:var(--red)}
.bval{font-size:10px;width:32px;text-align:right;color:var(--muted)}

/* stats */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-bottom:11px}
.stat{background:var(--surface2);border:1px solid var(--border);border-radius:6px;padding:8px;text-align:center}
.sn{font-size:21px;font-weight:700;color:var(--blue);line-height:1.1}
.sl{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;margin-top:3px}

/* commits */
.cmt{display:flex;gap:8px;padding:4px 0;border-bottom:1px solid var(--border);overflow:hidden}
.cmt:last-child{border-bottom:none}
.sha{color:var(--blue);font-size:11px;flex-shrink:0}
.cmsg{font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted)}

/* net */
.ngrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:7px}
.nchip{background:var(--surface2);border:1px solid var(--border);border-radius:6px;padding:7px 9px;display:flex;align-items:center;justify-content:space-between}
.nhost{font-size:10px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:130px}

/* chips */
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{background:var(--surface2);border:1px solid var(--border);border-radius:4px;padding:2px 7px;font-size:10px}
.chip.on{border-color:var(--green);color:var(--green);background:var(--green-dim)}

/* ── SERVICE CARDS ── */
.svc-card{background:var(--surface2);border:1px solid var(--border);border-radius:7px;padding:10px 12px;display:flex;align-items:flex-start;gap:10px;margin-bottom:8px}
.svc-card:last-child{margin-bottom:0}
.svc-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;margin-top:4px}
.svc-dot.running{background:var(--green)}
.svc-dot.stopped{background:var(--muted)}
.svc-dot.loading{background:var(--yellow);animation:blink 1s infinite}
.svc-info{flex:1;min-width:0}
.svc-name{font-size:12px;font-weight:600}
.svc-desc{font-size:10px;color:var(--muted);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.svc-meta{font-size:10px;color:var(--muted);margin-top:3px}
.svc-btns{display:flex;gap:4px;flex-shrink:0}
.svc-btn{background:var(--surface);border:1px solid var(--border);color:var(--muted);padding:2px 8px;border-radius:4px;cursor:pointer;font:inherit;font-size:10px;transition:all .1s}
.svc-btn:hover{border-color:var(--blue);color:var(--blue)}
.svc-btn.stop:hover{border-color:var(--red);color:var(--red)}
.svc-btn.log-btn:hover{border-color:var(--yellow);color:var(--yellow)}
.svc-btn:disabled{opacity:.4;cursor:default}
.svc-type{font-size:9px;padding:1px 5px;border-radius:3px;background:var(--surface);border:1px solid var(--border);margin-left:6px;color:var(--muted)}

/* repo card */
.repo-meta{font-size:11px;color:var(--muted);margin-bottom:8px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}

/* interface grid */
.iface-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:7px}
.iface-tile{background:var(--surface2);border:1px solid var(--border);border-radius:6px;padding:8px 10px}
.iface-kind{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
.iface-name{font-size:12px;font-weight:600;margin-top:2px}
.iface-desc{font-size:10px;color:var(--muted);margin-top:2px}
.iface-url{font-size:10px;color:var(--blue);margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ── RIGHT PANEL ── */
.ptabs{display:flex;border-bottom:1px solid var(--border);flex-shrink:0;background:var(--surface2)}
.ptab{padding:7px 13px;font-size:11px;cursor:pointer;color:var(--muted);border:none;border-bottom:2px solid transparent;background:none;font-family:inherit;transition:color .15s}
.ptab.active{color:var(--text);border-bottom-color:var(--accent)}
.ptab:hover:not(.active){color:var(--text)}
.tcontent{display:none;flex:1;overflow:hidden;flex-direction:column}
.tcontent.active{display:flex}

/* terminal */
.qbtns{display:flex;flex-wrap:wrap;gap:4px;padding:7px 10px;border-bottom:1px solid var(--border);flex-shrink:0}
.qb{background:var(--surface2);border:1px solid var(--border);color:var(--muted);padding:2px 8px;border-radius:12px;cursor:pointer;font-size:10px;font-family:inherit}
.qb:hover{border-color:var(--blue);color:var(--blue)}
.tbody{flex:1;overflow-y:auto;padding:8px 10px;font-size:11px;display:flex;flex-direction:column}
.tentry{margin-bottom:9px}
.tprompt{color:var(--green);margin-bottom:2px;display:flex;align-items:baseline;gap:5px;font-size:12px}
.tcmd{color:var(--text)}
.tout{white-space:pre-wrap;word-break:break-all;color:var(--text);font-size:11px;padding-left:10px;border-left:2px solid var(--border);max-height:300px;overflow-y:auto}
.trunning{color:var(--yellow);font-size:11px;animation:blink 1s infinite}
.texitok{color:var(--green);font-size:10px;margin-top:2px}
.texiterr{color:var(--red);font-size:10px;margin-top:2px}
.tinput-row{display:flex;align-items:center;gap:7px;padding:7px 10px;border-top:1px solid var(--border);flex-shrink:0;background:var(--surface2)}
.tpfx{color:var(--green);flex-shrink:0}
.tinput{flex:1;background:none;border:none;color:var(--text);font:inherit;font-size:12px;outline:none}
.trun{background:var(--accent);border:none;color:#fff;padding:3px 10px;border-radius:5px;cursor:pointer;font:inherit;font-size:11px}
.trun:hover{opacity:.85}
.trun.cancel{background:var(--red-dim);color:var(--red)}

/* log panel */
.logbody{flex:1;overflow-y:auto;padding:8px 10px}
.logline{font-size:10px;padding:2px 0;border-bottom:1px solid var(--border);color:var(--muted);white-space:pre-wrap;word-break:break-all}
.logline.ok{color:var(--green)}
.logline.err{color:var(--red)}

/* log viewer tab */
.logsel{display:flex;gap:5px;padding:7px 10px;border-bottom:1px solid var(--border);flex-shrink:0;flex-wrap:wrap}
.logsel button{background:var(--surface2);border:1px solid var(--border);color:var(--muted);padding:2px 8px;border-radius:4px;cursor:pointer;font:inherit;font-size:10px}
.logsel button.active{border-color:var(--blue);color:var(--blue)}
.logview{flex:1;overflow-y:auto;padding:8px 10px;font-size:10px;white-space:pre-wrap;word-break:break-all;color:var(--muted)}

footer{display:flex;justify-content:space-between;padding:6px 18px;background:var(--surface);border-top:1px solid var(--border);font-size:10px;color:var(--muted);flex-shrink:0}
</style>
</head>
<body>
<div class="layout">

<header>
  <div class="logo">⚡</div>
  <div>
    <h1>rstoi · Infraestrutura de IA</h1>
    <div class="sub" id="h-sub">carregando...</div>
  </div>
  <div class="hright">
    <span class="live-dot"></span>
    <span class="countdown" id="cd">10s</span>
    <button class="hbtn" onclick="refresh()">↺ refresh</button>
  </div>
</header>

<div class="body">
  <div class="left" id="left-root">
    <div style="color:var(--muted);padding:30px;text-align:center">Carregando...</div>
  </div>

  <div class="right">
    <div class="ptabs">
      <button class="ptab active" onclick="tab('terminal')">Terminal</button>
      <button class="ptab" onclick="tab('logs')">Logs</button>
      <button class="ptab" onclick="tab('statuslog')">Status Log</button>
    </div>

    <!-- terminal -->
    <div class="tcontent active" id="tc-terminal">
      <div class="qbtns">
        <button class="qb" onclick="qrun('npm run ctl')">ctl status</button>
        <button class="qb" onclick="qrun('npm run ctl git')">ctl git</button>
        <button class="qb" onclick="qrun('npm run ctl env')">ctl env</button>
        <button class="qb" onclick="qrun('npm test -- --reporter=verbose 2>&1 | tail -30')">tests</button>
        <button class="qb" onclick="qrun('git log --oneline -10')">git log</button>
        <button class="qb" onclick="qrun('git status')">git status</button>
        <button class="qb" onclick="qrun('free -h && df -h /')">recursos</button>
        <button class="qb" onclick="qrun('ls data/')">data/</button>
        <button class="qb" onclick="qrun('cat .mcp.json')">mcp.json</button>
        <button class="qb" onclick="qrun('ls src/adapters/')">adapters</button>
      </div>
      <div class="tbody" id="tbody">
        <div class="tentry">
          <div style="color:var(--muted);font-size:10px;padding:4px 0;border-bottom:1px solid var(--border);margin-bottom:6px">
            Terminal · /home/user/rstoi
          </div>
        </div>
      </div>
      <div class="tinput-row">
        <span class="tpfx">❯</span>
        <input class="tinput" id="tinput" placeholder="comando shell..." autocomplete="off" spellcheck="false"/>
        <button class="trun" id="trun-btn" onclick="runCmd()">Run</button>
      </div>
    </div>

    <!-- logs viewer -->
    <div class="tcontent" id="tc-logs">
      <div class="logsel" id="logsel">
        <span style="font-size:10px;color:var(--muted);align-self:center">Selecione:</span>
      </div>
      <div class="logview" id="logview">(selecione um serviço acima)</div>
    </div>

    <!-- status log -->
    <div class="tcontent" id="tc-statuslog">
      <div class="logbody" id="logbody">
        <div class="logline">Aguardando atualização de status...</div>
      </div>
    </div>
  </div>
</div>

<footer>
  <span id="ft-branch">—</span>
  <span id="ft-ts">—</span>
</footer>
</div>

<script>
// ── state ─────────────────────────────────────────────────────────────────────
let lastStatus = null, lastComponents = null, netData = [];
let cdCount = 10, cdTimer = null;
let running = false, abortCtrl = null;
const history = []; let histIdx = -1;
let activeLogId = null;

// ── helpers ───────────────────────────────────────────────────────────────────
const el  = id => document.getElementById(id);
const esc = s  => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const ts  = iso => new Date(iso).toLocaleTimeString('pt-BR');
function pctColor(p) { return p < 60 ? 'bg' : p < 85 ? 'by' : 'br'; }
function badge(cls, lbl) { return `<span class="badge ${cls}">${lbl}</span>`; }
function barRow(name, pct) {
  return `<div class="brow"><span class="bname">${name}</span><div class="bwrap"><div class="bar ${pctColor(pct)}" style="width:${pct}%"></div></div><span class="bval">${pct}%</span></div>`;
}
function rows(arr) {
  return arr.map(([l,v]) => `<div class="row"><span class="rl">${l}</span><span class="rv">${v}</span></div>`).join('');
}
function card(icon, title, body, wide) {
  return `<div class="card${wide?' wide':''}"><div class="ch"><span>${icon}</span> ${title}</div><div class="cb">${body}</div></div>`;
}
function fmtUp(s) {
  const h=Math.floor(s/3600),m=Math.floor((s%3600)/60);
  return h>0?`${h}h ${m}m`:`${m}m`;
}

// ── countdown ─────────────────────────────────────────────────────────────────
function startCd() {
  clearInterval(cdTimer);
  cdCount = 10;
  el('cd').textContent = '10s';
  cdTimer = setInterval(() => {
    cdCount--;
    el('cd').textContent = cdCount + 's';
    if (cdCount <= 0) { clearInterval(cdTimer); refresh(); }
  }, 1000);
}

// ── refresh ───────────────────────────────────────────────────────────────────
async function refresh() {
  clearInterval(cdTimer);
  try {
    const [s, c] = await Promise.all([
      fetch('/api/status').then(r => r.json()),
      fetch('/api/components').then(r => r.json()),
    ]);
    lastStatus = s; lastComponents = c;
    renderAll(s, c);
    el('ft-ts').textContent = 'atualizado ' + ts(s.ts);
    el('ft-branch').textContent = s.git.branch + (s.git.clean ? '' : ' · mudanças');
    el('h-sub').textContent = `rstoi/rstoi · ${s.git.branch} · WA: ${s.waAdapter}`;
    addLog(`[${ts(s.ts)}] ok · mem ${s.memory.pct}% · disk ${s.disk.pct}%`, 'ok');
  } catch(e) {
    addLog('[erro] ' + e.message, 'err');
  }
  startCd();
  fetchNet();
}

async function fetchNet() {
  try {
    netData = await fetch('/api/netcheck').then(r => r.json());
    const ng = el('ngrid');
    if (ng) renderNet(ng);
  } catch {}
}

// ── render ────────────────────────────────────────────────────────────────────
function renderAll(s, c) {
  const svcCards = renderComponents(c);
  const repoCard = renderRepos(c.repos || []);
  const ifaceCard = renderInterfaces(c.interfaces || []);

  const cards = [
    svcCards,
    card('🖥','Sistema', rows([
      ['OS', s.system.platform],
      ['Kernel', s.system.kernel],
      ['CPUs', s.system.cpus + ' vCPUs · load ' + s.system.loadavg.join(' ')],
      ['Uptime', fmtUp(s.system.uptime)],
      ['Node.js', badge('ok', s.runtimes.node)],
      ['Python', s.runtimes.python],
      ['Git', s.runtimes.git],
      ['Chromium', s.runtimes.chromium ? badge('ok', s.runtimes.chromium) : badge('err','ausente')],
    ])),
    card('📊','Recursos',
      barRow('RAM', s.memory.pct) + barRow('Disco', s.disk.pct) +
      rows([
        ['RAM', `${s.memory.usedMb}/${s.memory.totalMb} MiB`],
        ['Disco', `${Math.round(s.disk.usedMb/1024)}/${Math.round(s.disk.totalMb/1024)} GiB`],
      ])
    ),
    repoCard,
    ifaceCard,
    card('🗄','SQLite', rows([
      ['Mensagens', s.db.messages],
      ['Contatos', s.db.contacts],
      ['Tamanho', s.db.size + ' KiB'],
      ['Modo', 'WAL + FTS5'],
    ])),
    card('🌐','Rede', `<div class="ngrid" id="ngrid"><div style="color:var(--muted);font-size:10px">verificando...</div></div>`, true),
    card('🌿','Git',
      rows([
        ['Branch', `<span style="color:var(--green)">${esc(s.git.branch)}</span>`],
        ['Working tree', s.git.clean ? badge('ok','Clean') : badge('warn','Mudanças')],
        ['Último commit', esc(s.git.lastCommit)],
        ['Quando', s.git.lastTime],
      ]) +
      `<div style="margin-top:9px">${(s.git.log||[]).map(c=>`<div class="cmt"><span class="sha">${c.sha}</span><span class="cmsg">${esc(c.msg)}</span></div>`).join('')}</div>`
    ),
  ];

  el('left-root').innerHTML = `<div class="cards">${cards.join('')}</div>`;
  if (netData.length) renderNet(el('ngrid'));
  buildLogSelector(c.services || []);
}

function renderComponents(c) {
  const svcHtml = renderSvcGroup('SERVIÇOS', c.services?.filter(s => s.type !== 'agent') || []);
  const agentHtml = renderSvcGroup('AGENTES', c.services?.filter(s => s.type === 'agent') || []);
  return card('⚙️','Serviços & Agentes', svcHtml + agentHtml, true);
}

function renderSvcGroup(label, svcs) {
  if (!svcs.length) return '';
  const items = svcs.map(s => {
    const running = s.status === 'running';
    const typeBadge = {
      'mcp-server': 'MCP', 'web-server': 'WEB', 'agent': 'AGENT', 'worker': 'WORKER'
    }[s.type] ?? s.type;
    const pidInfo = running ? `PID ${s.pid}` : 'stopped';
    const triggers = s.triggers?.length ? `<span style="color:var(--purple);font-size:9px">${s.triggers.join(' ')}</span>` : '';
    return `
    <div class="svc-card">
      <div class="svc-dot ${running ? 'running' : 'stopped'}" id="dot-${s.id}"></div>
      <div class="svc-info">
        <div class="svc-name">${esc(s.name)}<span class="svc-type">${typeBadge}</span>${triggers}</div>
        <div class="svc-desc">${esc(s.description)}</div>
        <div class="svc-meta" id="meta-${s.id}">${pidInfo}</div>
      </div>
      <div class="svc-btns">
        ${running
          ? `<button class="svc-btn stop" onclick="svcAction('${s.id}','stop',this)">■ stop</button>
             <button class="svc-btn stop" onclick="svcAction('${s.id}','restart',this)">↺</button>`
          : `<button class="svc-btn" onclick="svcAction('${s.id}','start',this)">▶ start</button>`
        }
        <button class="svc-btn log-btn" onclick="viewLog('${s.id}')">log</button>
      </div>
    </div>`;
  }).join('');
  return `<div style="font-size:9px;font-weight:600;letter-spacing:.6px;color:var(--muted);text-transform:uppercase;margin:10px 0 6px">${label}</div>${items}`;
}

function renderRepos(repos) {
  const body = repos.map(r => {
    const commits = (r.log||[]).map(c=>`<div class="cmt"><span class="sha">${c.sha}</span><span class="cmsg">${esc(c.msg)}</span></div>`).join('');
    return `
    <div class="repo-meta">
      <span style="color:var(--blue)">${esc(r.name)}</span>
      <span class="badge ${r.clean?'ok':'warn'}">${r.clean?'clean':'mudanças'}</span>
      <span style="color:var(--green)">${esc(r.branch)}</span>
      ${r.ahead>0?`<span style="color:var(--yellow)">↑${r.ahead}</span>`:''}
    </div>
    <div style="font-size:10px;color:var(--muted);margin-bottom:6px">${esc(r.lastCommit)} · ${esc(r.lastTime)}</div>
    ${commits}`;
  }).join('<hr style="border-color:var(--border);margin:10px 0">');
  return card('🔗','Repositórios', body || '<span style="color:var(--muted)">nenhum</span>');
}

function renderInterfaces(ifaces) {
  const body = `<div class="iface-grid">${ifaces.map(i => {
    const icons = { cli:'⌨', web:'🌐', app:'📱', whatsapp:'💬' };
    const url = i.url ? `<div class="iface-url"><a href="${i.url}" target="_blank" style="color:var(--blue);text-decoration:none">${i.url}</a></div>` : '';
    return `<div class="iface-tile">
      <div class="iface-kind">${icons[i.kind]??'•'} ${i.kind}</div>
      <div class="iface-name">${esc(i.name)}</div>
      <div class="iface-desc">${esc(i.description)}</div>
      ${url}
    </div>`;
  }).join('')}</div>`;
  return card('🖥','Interfaces', body);
}

function renderNet(ng) {
  if (!ng) return;
  ng.innerHTML = netData.map(n => {
    const ok = n.code >= 200 && n.code < 400;
    return `<div class="nchip"><span class="nhost" title="${n.host}">${n.host}</span>${badge(ok?'ok':'err', ok?n.code+'':'n.code===0?'timeout':n.code)}</div>`;
  }).join('');
}

// ── service actions ───────────────────────────────────────────────────────────
async function svcAction(id, action, btn) {
  const dot = el('dot-' + id);
  const meta = el('meta-' + id);
  if (dot) { dot.className = 'svc-dot loading'; }
  if (btn) { btn.disabled = true; }

  try {
    const r = await fetch(`/api/services/${id}/${action}`, { method: 'POST' }).then(x => x.json());
    addLog(`[${id}] ${action}: ${r.ok ? 'ok' : r.error}`, r.ok ? 'ok' : 'err');
    // refresh after 1s to get updated status
    setTimeout(() => refresh(), 1200);
  } catch(e) {
    addLog(`[${id}] ${action} erro: ${e.message}`, 'err');
    if (dot) dot.className = 'svc-dot stopped';
    if (btn) btn.disabled = false;
  }
}

// ── logs viewer ───────────────────────────────────────────────────────────────
function buildLogSelector(svcs) {
  const sel = el('logsel');
  if (!sel || !svcs.length) return;
  const existing = new Set([...sel.querySelectorAll('button')].map(b => b.dataset.id));
  for (const s of svcs) {
    if (existing.has(s.id)) continue;
    const btn = document.createElement('button');
    btn.dataset.id = s.id;
    btn.textContent = s.name;
    btn.onclick = () => viewLog(s.id);
    sel.appendChild(btn);
  }
}

async function viewLog(id) {
  activeLogId = id;
  tab('logs');
  const sel = el('logsel');
  if (sel) sel.querySelectorAll('button').forEach(b => b.classList.toggle('active', b.dataset.id === id));
  const view = el('logview');
  if (!view) return;
  view.textContent = 'carregando…';
  try {
    const r = await fetch(`/api/services/${id}/logs?lines=100`).then(x => x.json());
    view.textContent = r.lines?.join('\n') || '(sem logs)';
    view.scrollTop = view.scrollHeight;
  } catch(e) {
    view.textContent = 'erro: ' + e.message;
  }
}

// ── terminal ──────────────────────────────────────────────────────────────────
function addLog(msg, cls) {
  const b = el('logbody');
  const d = document.createElement('div');
  d.className = 'logline ' + (cls || '');
  d.textContent = msg;
  b.appendChild(d);
  b.scrollTop = b.scrollHeight;
  while (b.children.length > 400) b.removeChild(b.firstChild);
}

function appendTerm(html) {
  el('tbody').insertAdjacentHTML('beforeend', html);
  el('tbody').scrollTop = 9e9;
}

async function runCmd() {
  if (running) { if (abortCtrl) abortCtrl.abort(); return; }
  const inp = el('tinput');
  const btn = el('trun-btn');
  const cmd = inp.value.trim();
  if (!cmd) return;
  history.unshift(cmd); histIdx = -1;
  inp.value = '';
  const eid = 'e' + Date.now();
  appendTerm(`
    <div class="tentry" id="${eid}">
      <div class="tprompt">❯ <span class="tcmd">${esc(cmd)}</span></div>
      <div class="tout" id="out-${eid}"><span class="trunning">⠋ executando…</span></div>
    </div>`);
  running = true; btn.textContent = '✕'; btn.className = 'trun cancel';
  abortCtrl = new AbortController();
  const outEl = el('out-' + eid);
  try {
    const resp = await fetch('/api/exec/stream', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ cmd }),
      signal: abortCtrl.signal,
    });
    outEl.innerHTML = '';
    const reader = resp.body.getReader();
    const dec = new TextDecoder();
    let buf = '';
    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      const lines = buf.split('\n'); buf = lines.pop();
      for (const line of lines) {
        if (!line.startsWith('data:')) continue;
        const { type, data } = JSON.parse(line.slice(5).trim());
        if (type === 'stdout') { const s=document.createElement('span');s.textContent=data;outEl.appendChild(s); }
        else if (type === 'stderr') { const s=document.createElement('span');s.style.color='var(--yellow)';s.textContent=data;outEl.appendChild(s); }
        else if (type === 'exit') { const d=document.createElement('div');d.className=parseInt(data)===0?'texitok':'texiterr';d.textContent='↳ exit '+data;outEl.parentElement.appendChild(d); }
        else if (type === 'error') { const s=document.createElement('span');s.style.color='var(--red)';s.textContent='[erro: '+data+']';outEl.appendChild(s); }
        el('tbody').scrollTop = 9e9;
      }
    }
  } catch(e) {
    if (e.name !== 'AbortError') outEl.innerHTML=`<span style="color:var(--red)">[falha: ${esc(e.message)}]</span>`;
    else outEl.innerHTML+=`<span style="color:var(--yellow)">\n[cancelado]</span>`;
  }
  running = false; btn.textContent = 'Run'; btn.className = 'trun'; abortCtrl = null;
  el('tbody').scrollTop = 9e9;
}

function qrun(cmd) { el('tinput').value = cmd; tab('terminal'); runCmd(); }

el('tinput').addEventListener('keydown', e => {
  if (e.key === 'Enter') { e.preventDefault(); runCmd(); }
  if (e.key === 'ArrowUp') { e.preventDefault(); if (histIdx < history.length-1) { histIdx++; e.target.value = history[histIdx]; } }
  if (e.key === 'ArrowDown') { e.preventDefault(); if (histIdx > 0) { histIdx--; e.target.value = history[histIdx]; } else { histIdx=-1; e.target.value=''; } }
});

// ── tabs ──────────────────────────────────────────────────────────────────────
function tab(name) {
  const names = ['terminal','logs','statuslog'];
  document.querySelectorAll('.ptab').forEach((t,i) => t.classList.toggle('active', names[i]===name));
  document.querySelectorAll('.tcontent').forEach((c,i) => c.classList.toggle('active', names[i]===name));
}

// ── init ──────────────────────────────────────────────────────────────────────
refresh();
</script>
