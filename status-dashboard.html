<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Claude Code · Status ao Vivo</title>
<style>
:root{
  --bg:#0d1117;--surface:#161b22;--surface2:#21262d;--border:#30363d;
  --text:#e6edf3;--muted:#8b949e;
  --green:#3fb950;--green-dim:#0e2a18;
  --red:#f85149;--red-dim:#3d1a19;
  --yellow:#d29922;--yellow-dim:#2e2100;
  --blue:#58a6ff;--blue-dim:#051d4d;
  --purple:#bc8cff;--purple-dim:#1e0e3d;
  --accent:#1f6feb;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--text);font-family:'SF Mono','Consolas','Liberation Mono',monospace;font-size:13px;line-height:1.5}

/* ── layout ── */
.layout{display:grid;grid-template-rows:auto 1fr auto;height:100vh}
header{display:flex;align-items:center;gap:12px;padding:10px 18px;background:var(--surface);border-bottom:1px solid var(--border)}
.logo{width:34px;height:34px;background:linear-gradient(135deg,#1f6feb,#bc8cff);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0}
header h1{font-size:14px;font-weight:600}
.sub{font-size:11px;color:var(--muted);margin-top:1px}
.hright{margin-left:auto;display:flex;align-items:center;gap:10px}
.live-dot{width:7px;height:7px;border-radius:50%;background:var(--green);animation:blink 2s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
.countdown{font-size:11px;color:var(--muted);min-width:22px}
.hbtn{background:var(--surface2);border:1px solid var(--border);color:var(--text);padding:3px 10px;border-radius:5px;cursor:pointer;font:inherit;font-size:11px}
.hbtn:hover{background:var(--border)}

/* ── split ── */
.body{display:grid;grid-template-columns:1fr 400px;overflow:hidden;height:100%}
.left{overflow-y:auto;padding:14px;background:var(--bg)}
.right{border-left:1px solid var(--border);display:flex;flex-direction:column;background:var(--surface);overflow:hidden}

/* ── cards ── */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:10px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:8px;overflow:hidden}
.card.wide{grid-column:1/-1}
.ch{display:flex;align-items:center;gap:7px;padding:8px 13px;background:var(--surface2);border-bottom:1px solid var(--border);font-size:10px;font-weight:600;letter-spacing:.7px;text-transform:uppercase;color:var(--muted)}
.cb{padding:10px 13px}

/* rows */
.row{display:flex;justify-content:space-between;align-items:center;padding:3.5px 0;border-bottom:1px solid var(--border)}
.row:last-child{border-bottom:none}
.rl{color:var(--muted);font-size:12px}
.rv{font-weight:500;text-align:right;font-size:12px;max-width:63%;word-break:break-all}

/* badges */
.badge{display:inline-flex;align-items:center;gap:4px;padding:1px 7px;border-radius:20px;font-size:10px;font-weight:600}
.badge::before{content:'';width:5px;height:5px;border-radius:50%}
.ok{background:var(--green-dim);color:var(--green)}.ok::before{background:var(--green)}
.err{background:var(--red-dim);color:var(--red)}.err::before{background:var(--red)}
.warn{background:var(--yellow-dim);color:var(--yellow)}.warn::before{background:var(--yellow)}
.info{background:var(--blue-dim);color:var(--blue)}.info::before{background:var(--blue)}
.mock{background:var(--purple-dim);color:var(--purple)}.mock::before{background:var(--purple)}

/* bars */
.brow{display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid var(--border)}
.brow:last-child{border-bottom:none}
.bname{color:var(--muted);width:65px;font-size:11px;flex-shrink:0}
.bwrap{flex:1;background:var(--surface2);border-radius:3px;height:5px;overflow:hidden}
.bar{height:100%;border-radius:3px;transition:width .6s ease}
.bg{background:var(--green)}.by{background:var(--yellow)}.br{background:var(--red)}
.bval{font-size:10px;width:32px;text-align:right;color:var(--muted)}

/* stats */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-bottom:11px}
.stat{background:var(--surface2);border:1px solid var(--border);border-radius:6px;padding:8px;text-align:center}
.sn{font-size:21px;font-weight:700;color:var(--blue);line-height:1.1}
.sl{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;margin-top:3px}

/* commits */
.cmt{display:flex;gap:8px;padding:4px 0;border-bottom:1px solid var(--border);overflow:hidden}
.cmt:last-child{border-bottom:none}
.sha{color:var(--blue);font-size:11px;flex-shrink:0}
.cmsg{font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted)}

/* net chips */
.ngrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:7px}
.nchip{background:var(--surface2);border:1px solid var(--border);border-radius:6px;padding:7px 9px;display:flex;align-items:center;justify-content:space-between}
.nhost{font-size:10px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:120px}

/* chips */
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{background:var(--surface2);border:1px solid var(--border);border-radius:4px;padding:2px 7px;font-size:10px}
.chip.on{border-color:var(--green);color:var(--green);background:var(--green-dim)}

/* ── RIGHT PANEL ── */
.ptabs{display:flex;border-bottom:1px solid var(--border);flex-shrink:0;background:var(--surface2)}
.ptab{padding:7px 14px;font-size:11px;cursor:pointer;color:var(--muted);border:none;border-bottom:2px solid transparent;background:none;font-family:inherit;transition:color .15s}
.ptab.active{color:var(--text);border-bottom-color:var(--accent)}
.ptab:hover:not(.active){color:var(--text)}

.tcontent{display:none;flex:1;overflow:hidden;flex-direction:column}
.tcontent.active{display:flex}

/* terminal */
.qbtns{display:flex;flex-wrap:wrap;gap:4px;padding:7px 10px;border-bottom:1px solid var(--border);flex-shrink:0}
.qb{background:var(--surface2);border:1px solid var(--border);color:var(--muted);padding:2px 8px;border-radius:12px;cursor:pointer;font-size:10px;font-family:inherit}
.qb:hover{border-color:var(--blue);color:var(--blue)}

.tbody{flex:1;overflow-y:auto;padding:8px 10px;font-size:11px;display:flex;flex-direction:column}
.tentry{margin-bottom:9px}
.tprompt{color:var(--green);margin-bottom:2px;display:flex;align-items:baseline;gap:5px;font-size:12px}
.tcmd{color:var(--text)}
.tout{white-space:pre-wrap;word-break:break-all;color:var(--text);font-size:11px;padding-left:10px;border-left:2px solid var(--border);max-height:300px;overflow-y:auto}
.terr{white-space:pre-wrap;word-break:break-all;color:var(--yellow);font-size:11px;padding-left:10px;border-left:2px solid var(--yellow-dim)}
.texitok{color:var(--green);font-size:10px;margin-top:2px}
.texiterr{color:var(--red);font-size:10px;margin-top:2px}
.trunning{color:var(--yellow);font-size:11px;animation:blink 1s infinite}

.tinput-row{display:flex;align-items:center;gap:7px;padding:7px 10px;border-top:1px solid var(--border);flex-shrink:0;background:var(--surface2)}
.tpfx{color:var(--green);flex-shrink:0}
.tinput{flex:1;background:none;border:none;color:var(--text);font:inherit;font-size:12px;outline:none}
.trun{background:var(--accent);border:none;color:#fff;padding:3px 10px;border-radius:5px;cursor:pointer;font:inherit;font-size:11px}
.trun:hover{opacity:.85}
.trun.cancel{background:var(--red-dim);color:var(--red)}

/* log tab */
.logentry{font-size:10px;padding:2px 0;border-bottom:1px solid var(--border);color:var(--muted)}
.logentry.ok{color:var(--green)}
.logentry.err{color:var(--red)}

footer{display:flex;justify-content:space-between;padding:6px 18px;background:var(--surface);border-top:1px solid var(--border);font-size:10px;color:var(--muted);flex-shrink:0}
</style>
</head>
<body>
<div class="layout">

<!-- HEADER -->
<header>
  <div class="logo">⚡</div>
  <div>
    <h1>Claude Code · Status ao Vivo</h1>
    <div class="sub" id="h-sub">rstoi/rstoi — carregando...</div>
  </div>
  <div class="hright">
    <span class="live-dot"></span>
    <span class="countdown" id="cd">5s</span>
    <button class="hbtn" onclick="refresh()">↺</button>
  </div>
</header>

<!-- MAIN -->
<div class="body">

  <!-- LEFT: cards -->
  <div class="left" id="status-root">
    <div style="color:var(--muted);padding:30px;text-align:center">Carregando...</div>
  </div>

  <!-- RIGHT: panel -->
  <div class="right">
    <div class="ptabs">
      <button class="ptab active" onclick="tab('terminal')">Terminal</button>
      <button class="ptab" onclick="tab('statuslog')">Status Log</button>
    </div>

    <!-- terminal -->
    <div class="tcontent active" id="tc-terminal">
      <div class="qbtns">
        <button class="qb" onclick="qrun('git log --oneline -10')">git log</button>
        <button class="qb" onclick="qrun('git status')">git status</button>
        <button class="qb" onclick="qrun('node --test 2>&1 | tail -25')">testes</button>
        <button class="qb" onclick="qrun('free -h && df -h /')">recursos</button>
        <button class="qb" onclick="qrun('pgrep -a Xvfb || echo parado')">xvfb?</button>
        <button class="qb" onclick="qrun('Xvfb :99 -screen 0 1366x768x24 -ac &>/tmp/xvfb.log & sleep 1 && echo ok')">start xvfb</button>
        <button class="qb" onclick="qrun('sqlite3 data/whatsapp.db \".tables\"')">db</button>
        <button class="qb" onclick="qrun('curl -s http://localhost:4000/health || echo offline')">mock?</button>
        <button class="qb" onclick="qrun('cat .mcp.json')">mcp.json</button>
        <button class="qb" onclick="qrun('ls src/')">src/</button>
        <button class="qb" onclick="qrun('git diff HEAD~1 --stat')">último diff</button>
        <button class="qb" onclick="qrun('cat .env')">env</button>
      </div>
      <div class="tbody" id="tbody">
        <div class="tentry">
          <div style="color:var(--muted);font-size:10px;padding:4px 0;border-bottom:1px solid var(--border);margin-bottom:6px">
            Terminal · /home/user/rstoi · DISPLAY=:99
          </div>
        </div>
      </div>
      <div class="tinput-row">
        <span class="tpfx">❯</span>
        <input class="tinput" id="tinput" placeholder="comando shell..." autocomplete="off" spellcheck="false"/>
        <button class="trun" id="trun-btn" onclick="runCmd()">Run</button>
      </div>
    </div>

    <!-- status log -->
    <div class="tcontent" id="tc-statuslog">
      <div class="tbody" id="logbody">
        <div style="color:var(--muted);font-size:10px;padding:4px 0">Aguardando atualização de status...</div>
      </div>
    </div>
  </div>
</div>

<footer>
  <span id="ft-branch">—</span>
  <span id="ft-ts">—</span>
</footer>

</div>

<script>
// ─── state ────────────────────────────────────────────────────────────────────
let lastStatus = null, netData = [], cdCount = 5, cdTimer = null;
let running = false, abortCtrl = null;
const history = []; let histIdx = -1;

// ─── countdown / refresh loop ─────────────────────────────────────────────────
function startCd() {
  clearInterval(cdTimer);
  cdCount = 5;
  el('cd').textContent = '5s';
  cdTimer = setInterval(() => {
    cdCount--;
    el('cd').textContent = cdCount + 's';
    if (cdCount <= 0) { clearInterval(cdTimer); refresh(); }
  }, 1000);
}

async function refresh() {
  clearInterval(cdTimer);
  try {
    const s = await fetch('/api/status').then(r => r.json());
    lastStatus = s;
    renderAll(s);
    addLog(`[${ts(s.ts)}] OK · mem ${s.memory.pct}% · disk ${s.disk.pct}% · xvfb:${s.display.xvfbRunning?'on':'OFF'} · tests ${s.tests.pass}p`, 'ok');
    el('ft-ts').textContent = 'atualizado ' + ts(s.ts);
    el('ft-branch').textContent = 'branch: ' + s.git.branch;
    el('h-sub').textContent = 'rstoi/rstoi · ' + s.git.branch + (s.git.clean ? '' : ' · mudanças pendentes');
  } catch(e) {
    addLog('[erro] ' + e.message, 'err');
  }
  startCd();
  fetchNet();
}

async function fetchNet() {
  try {
    const d = await fetch('/api/netcheck').then(r => r.json());
    netData = d;
    if (lastStatus) renderNet(d);
  } catch {}
}

// ─── helpers ──────────────────────────────────────────────────────────────────
const el = id => document.getElementById(id);
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const ts = iso => new Date(iso).toLocaleTimeString('pt-BR');
function fmtUp(s) {
  const d=Math.floor(s/86400),h=Math.floor((s%86400)/3600),m=Math.floor((s%3600)/60);
  return (d?d+'d ':'')+( h?h+'h ':'')+m+'m';
}
function pctColor(p) { return p<60?'bg':p<85?'by':'br'; }
function badge(cls, lbl) { return `<span class="badge ${cls}">${lbl}</span>`; }
function barRow(name, pct) {
  const c = pctColor(pct);
  return `<div class="brow"><span class="bname">${name}</span><div class="bwrap"><div class="bar ${c}" style="width:${pct}%"></div></div><span class="bval">${pct}%</span></div>`;
}
function rows(arr) {
  return arr.map(([l,v]) => `<div class="row"><span class="rl">${l}</span><span class="rv">${v}</span></div>`).join('');
}
function card(icon, title, body, wide) {
  return `<div class="card${wide?' wide':''}"><div class="ch"><span>${icon}</span> ${title}</div><div class="cb">${body}</div></div>`;
}

// ─── render ───────────────────────────────────────────────────────────────────
function renderAll(s) {
  const cards = [
    card('🖥','Sistema', rows([
      ['OS', s.system.platform],
      ['Kernel', s.system.kernel],
      ['CPU', s.system.cpuModel + ' · ' + s.system.cpus + ' vCPUs'],
      ['Uptime', '<span style="color:var(--blue)">' + fmtUp(s.system.uptime) + '</span>'],
      ['Load avg', s.system.loadavg.join(' / ')],
      ['Ambiente', badge('info','container remoto')],
    ])),

    card('📊','Recursos',
      barRow('RAM', s.memory.pct) +
      barRow('Disco /', s.disk.pct) +
      rows([
        ['RAM usada', s.memory.usedMb + ' Mi / ' + s.memory.totalMb + ' Mi'],
        ['Disco usado', Math.round(s.disk.usedMb/1024) + ' Gi / ' + Math.round(s.disk.totalMb/1024) + ' Gi'],
      ])
    ),

    card('🖼','Display Virtual', rows([
      ['Xvfb', s.display.xvfbRunning ? badge('ok','Rodando :99') : badge('err','Parado')],
      ['PID', s.display.pid || '—'],
      ['Resolução', '1366 × 768 × 24bpp'],
      ['Chromium', badge('ok','141.0 (Playwright)')],
    ])),

    card('⚙️','Runtimes', rows([
      ['Node.js', badge('ok', s.runtimes.node)],
      ['npm', s.runtimes.npm],
      ['tsx', badge('ok', s.runtimes.tsx.replace('node ',''))],
      ['Python', s.runtimes.python],
      ['Git', s.runtimes.git],
      ['Chromium', s.runtimes.chromium ? badge('ok', s.runtimes.chromium.replace('Chromium ','')) : '—'],
    ])),

    card('🔌','MCP Servers',
      rows([
        ['computer-use', s.mcp.enabled.includes('computer-use') ? badge('ok','Ativo') : badge('err','Inativo')],
        ['whatsapp-business', badge('err','Removido')],
      ]) +
      `<div style="margin-top:9px"><div style="color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.5px;margin-bottom:5px">16 ferramentas</div>
      <div class="chips">${['screenshot','mouse_move','left_click','right_click','double_click','middle_click','scroll','drag_and_drop','type','key','get_screen_size','get_mouse_position','get_active_window','focus_window','open_application','run_command'].map(t=>`<span class="chip on">${t}</span>`).join('')}</div></div>`
    ),

    card('🗄','SQLite',
      `<div class="stats"><div class="stat"><div class="sn">${s.db.messages}</div><div class="sl">Mensagens</div></div><div class="stat"><div class="sn">${s.db.contacts}</div><div class="sl">Contatos</div></div><div class="stat"><div class="sn">${s.db.size}K</div><div class="sl">Tamanho</div></div></div>` +
      rows([
        ['Arquivo', './data/whatsapp.db'],
        ['Modo', 'WAL + FTS5'],
        ['Tabelas', 'messages · contacts · groups'],
        ['Status', badge('ok','Online')],
      ])
    ),

    card('✅','Testes',
      `<div class="stats"><div class="stat"><div class="sn" style="color:var(--green)">${s.tests.pass}</div><div class="sl">Passando</div></div><div class="stat"><div class="sn" style="color:var(--red)">${s.tests.fail}</div><div class="sl">Falhando</div></div><div class="stat"><div class="sn">${s.tests.pass+s.tests.fail}</div><div class="sl">Total</div></div></div>` +
      rows([
        ['store/db', badge('ok','6/6')],
        ['tools/messaging', badge('ok','6/6')],
        ['tools/contacts', badge('ok','3/3')],
        ['tools/profile', badge('ok','4/4')],
      ])
    ),

    card('🌿','Git',
      rows([
        ['Branch', `<span style="color:var(--green)">${esc(s.git.branch)}</span>`],
        ['Working tree', s.git.clean ? badge('ok','Clean') : badge('warn','Mudanças')],
        ['Último commit', esc(s.git.lastCommit)],
        ['Quando', s.git.lastCommitTime],
      ]) +
      `<div style="margin-top:9px">${(s.git.log||[]).map(c=>`<div class="cmt"><span class="sha">${c.sha}</span><span class="cmsg">${esc(c.msg)}</span></div>`).join('')}</div>`
    ),

    card('💬','WhatsApp', rows([
      ['Adaptador', badge('mock', s.waAdapter)],
      ['cloud-api', badge('mock','Mock :4000')],
      ['twilio', badge('warn','Sem credenciais')],
      ['baileys', badge('warn','Local only')],
      ['Transport', 'stdio'],
      ['Webhook', ':3000'],
    ])),

    card('🌐','Rede',
      `<div style="color:var(--muted);font-size:10px;margin-bottom:8px">Cache 30s · allowlist: github.com</div>
      <div class="ngrid" id="ngrid"><div style="color:var(--muted);font-size:10px">verificando...</div></div>`, true),
  ];

  el('status-root').innerHTML = `<div class="cards">${cards.join('')}</div>`;
  if (netData.length) renderNet(netData);
}

function renderNet(data) {
  const ng = el('ngrid');
  if (!ng) return;
  ng.innerHTML = data.map(n => {
    const ok = n.code === 200;
    return `<div class="nchip"><span class="nhost" title="${n.host}">${n.host}</span>${badge(ok?'ok':'err', ok?'200 OK': (n.code===0?'timeout':n.code+' bloq.'))}</div>`;
  }).join('');
}

// ─── terminal ─────────────────────────────────────────────────────────────────
function addLog(msg, cls) {
  const b = el('logbody');
  const d = document.createElement('div');
  d.className = 'logentry ' + (cls||'');
  d.textContent = msg;
  b.appendChild(d);
  b.scrollTop = b.scrollHeight;
  while (b.children.length > 300) b.removeChild(b.children[1]);
}

function append(html) {
  el('tbody').insertAdjacentHTML('beforeend', html);
  el('tbody').scrollTop = 9e9;
}

async function runCmd() {
  if (running) { if (abortCtrl) abortCtrl.abort(); return; }
  const inp = el('tinput');
  const btn = el('trun-btn');
  const cmd = inp.value.trim();
  if (!cmd) return;

  history.unshift(cmd); histIdx = -1;
  inp.value = '';

  const eid = 'e' + Date.now();
  append(`
    <div class="tentry" id="${eid}">
      <div class="tprompt">❯ <span class="tcmd">${esc(cmd)}</span></div>
      <div class="tout" id="out-${eid}"><span class="trunning">⠋ executando…</span></div>
    </div>`);

  running = true;
  btn.textContent = '✕';
  btn.className = 'trun cancel';
  abortCtrl = new AbortController();

  const outEl = el('out-' + eid);

  try {
    const resp = await fetch('/api/exec/stream', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ cmd }),
      signal: abortCtrl.signal,
    });

    outEl.innerHTML = '';
    const reader = resp.body.getReader();
    const dec = new TextDecoder();
    let buf = '';

    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      const lines = buf.split('\n'); buf = lines.pop();
      for (const line of lines) {
        if (!line.startsWith('data:')) continue;
        const { type, data } = JSON.parse(line.slice(5).trim());
        if (type === 'stdout') {
          const s = document.createElement('span'); s.textContent = data; outEl.appendChild(s);
        } else if (type === 'stderr') {
          const s = document.createElement('span'); s.style.color = 'var(--yellow)'; s.textContent = data; outEl.appendChild(s);
        } else if (type === 'exit') {
          const code = parseInt(data, 10);
          const d = document.createElement('div');
          d.className = code === 0 ? 'texitok' : 'texiterr';
          d.textContent = '↳ exit ' + code;
          outEl.parentElement.appendChild(d);
        } else if (type === 'error') {
          const s = document.createElement('span'); s.style.color='var(--red)'; s.textContent='[erro: '+data+']'; outEl.appendChild(s);
        }
        el('tbody').scrollTop = 9e9;
      }
    }
  } catch (e) {
    if (e.name !== 'AbortError') {
      outEl.innerHTML = `<span style="color:var(--red)">[falha: ${esc(e.message)}]</span>`;
    } else {
      outEl.innerHTML += `<span style="color:var(--yellow)">\n[cancelado]</span>`;
    }
  }

  running = false;
  btn.textContent = 'Run';
  btn.className = 'trun';
  abortCtrl = null;
  el('tbody').scrollTop = 9e9;
}

function qrun(cmd) {
  el('tinput').value = cmd;
  tab('terminal');
  runCmd();
}

// ─── keyboard ─────────────────────────────────────────────────────────────────
el('tinput').addEventListener('keydown', e => {
  if (e.key === 'Enter') { e.preventDefault(); runCmd(); }
  if (e.key === 'ArrowUp') {
    e.preventDefault();
    if (histIdx < history.length - 1) { histIdx++; e.target.value = history[histIdx]; }
  }
  if (e.key === 'ArrowDown') {
    e.preventDefault();
    if (histIdx > 0) { histIdx--; e.target.value = history[histIdx]; }
    else { histIdx = -1; e.target.value = ''; }
  }
});

// ─── tabs ─────────────────────────────────────────────────────────────────────
function tab(name) {
  const names = ['terminal','statuslog'];
  document.querySelectorAll('.ptab').forEach((t,i) => t.classList.toggle('active', names[i]===name));
  document.querySelectorAll('.tcontent').forEach((c,i) => c.classList.toggle('active', names[i]===name));
}

// ─── init ─────────────────────────────────────────────────────────────────────
refresh();
</script>
</body>
</html>
